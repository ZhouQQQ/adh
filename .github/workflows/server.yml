name: adh-server docker build

on:
  # 只有打 tag 或手动触发才构建，main 分支 push 不再消耗 Actions
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  ALIYUN_REGISTRY: registry.cn-shenzhen.aliyuncs.com
  ALIYUN_IMAGE: registry.cn-shenzhen.aliyuncs.com/xiaoantest/adh-server

# 同一分支连续 push 时取消上一次，避免重复构建
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # 镜像内要带直连 APK，这里自行构建，不依赖 portal.yml 的 artifact
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 安装 Android SDK 34
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "未找到 sdkmanager，请检查 runner 的 Android SDK 安装"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: 构建直连 APK
        working-directory: apps/portal-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 校验 APK 产物
        run: test -f apps/portal-android/app/build/outputs/apk/debug/app-debug.apk

      - uses: docker/setup-buildx-action@v3

      # 小写镜像名：GHCR 不接受大写
      - name: 小写镜像名
        id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      # 配了阿里云密码就同时推两份，没配就只推 GHCR
      - name: 计算推送目标
        id: targets
        env:
          ALIYUN_PASSWORD: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}
        run: |
          {
            echo "images<<EOF"
            echo "${REGISTRY}/${GITHUB_REPOSITORY,,}"
            if [ -n "${ALIYUN_PASSWORD}" ]; then
              echo "${ALIYUN_IMAGE}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "${ALIYUN_PASSWORD}" ]; then
            echo "has_aliyun=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_aliyun=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 登录 GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录阿里云 ACR
        if: github.event_name != 'pull_request' && steps.targets.outputs.has_aliyun == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ALIYUN_REGISTRY_USERNAME }}
          password: ${{ secrets.ALIYUN_REGISTRY_PASSWORD }}

      - name: 生成标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.targets.outputs.images }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 启动日志里的版本号：tag 构建用 v0.1.6，手动触发用 short sha
          build-args: |
            VERSION=${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
          # 阿里云 ACR 不识别 buildx 默认生成的 provenance / sbom（OCI empty manifest）
          provenance: false
          sbom: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
