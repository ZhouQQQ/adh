name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 让打包脚本用 tag 作为版本号（server 包内目录、agent 包内目录都靠它）
  ADH_VERSION: ${{ github.ref_name }}

jobs:
  # ---------------------------------------------------------------- #
  # 1. 直连 App（Android APK）
  # ---------------------------------------------------------------- #
  portal-apk:
    name: Build portal APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 34
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Assemble debug APK
        working-directory: apps/portal-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: portal-apk
          path: apps/portal-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- #
  # 2. server / agent 分发包（需要 APK 一起打进 server 包）
  # ---------------------------------------------------------------- #
  packages:
    name: Build server & agent
    runs-on: ubuntu-latest
    needs: portal-apk
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 把 APK 放回 Gradle 产物路径，package:server 会把它复制进包内 portal/
      - uses: actions/download-artifact@v4
        with:
          name: portal-apk
          path: apps/portal-android/app/build/outputs/apk/debug

      - name: Build web
        run: pnpm --filter @adh/web build

      - name: Package server (linux)
        run: pnpm package:server --platform linux

      - name: Package agent (linux)
        run: pnpm package:agent --platform linux

      - uses: actions/upload-artifact@v4
        with:
          name: server-agent
          path: |
            dist/adh-server-linux.zip
            dist/adh-agent-linux.zip
            dist/adh-agent-manifest.json
          if-no-files-found: error

  # ---------------------------------------------------------------- #
  # 3. 发布：APK 单独一份 + server / agent 包
  # ---------------------------------------------------------------- #
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [portal-apk, packages]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p release
          cp artifacts/portal-apk/app-debug.apk "release/adh-portal-${ADH_VERSION}.apk"
          cp artifacts/server-agent/*.zip release/
          cp artifacts/server-agent/*.json release/
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
