name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  # 让打包脚本用 tag 作为版本号（server 包内目录、agent 包内目录都靠它）
  ADH_VERSION: ${{ github.ref_name }}

jobs:
  # ---------------------------------------------------------------- #
  # 1. 直连 App（Android APK）
  # ---------------------------------------------------------------- #
  portal-apk:
    name: adh-portal apk package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest 已预装 Android SDK，不需要 setup-android（它的 sdkmanager tools 在新版 cmdline-tools 下会失败）
      - name: Install Android SDK 34
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME" -name sdkmanager -type f 2>/dev/null | head -n 1)"
          fi
          echo "sdkmanager: $SDKMANAGER"
          if [ -z "$SDKMANAGER" ]; then
            echo "未找到 sdkmanager，请检查 runner 的 Android SDK 安装"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" >/dev/null

      - name: Assemble debug APK
        working-directory: apps/portal-android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: adh-portal-apk
          path: apps/portal-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- #
  # 2. server / agent 分发包（需要 APK 一起打进 server 包）
  # ---------------------------------------------------------------- #
  packages:
    name: Build server & agent
    runs-on: ubuntu-latest
    needs: portal-apk
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 把 APK 放回 Gradle 产物路径，package:server 会把它复制进包内 portal/
      - uses: actions/download-artifact@v4
        with:
          name: adh-portal-apk
          path: apps/portal-android/app/build/outputs/apk/debug

      - name: Build web
        run: pnpm --filter @adh/web build

      - name: Package server (linux)
        run: pnpm package:server --platform linux

      - name: Package agent (linux)
        run: pnpm package:agent --platform linux

      - uses: actions/upload-artifact@v4
        with:
          name: server-agent
          path: |
            dist/adh-server-linux.zip
            dist/adh-agent-linux.zip
            dist/adh-agent-manifest.json
          if-no-files-found: error

  # ---------------------------------------------------------------- #
  # 3. 发布：APK 单独一份 + server / agent 包
  # ---------------------------------------------------------------- #
  release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [portal-apk, packages]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect files
        run: |
          mkdir -p release
          cp artifacts/adh-portal-apk/app-debug.apk "release/adh-portal-apk-${ADH_VERSION}.apk"
          cp artifacts/server-agent/*.zip release/
          cp artifacts/server-agent/*.json release/
          ls -lh release

      - uses: softprops/action-gh-release@v2
        with:
          name: ADH ${{ github.ref_name }}
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
