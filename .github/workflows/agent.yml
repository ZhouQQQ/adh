name: adh-agent packages

# 只在发版 tag 或手动触发时打包。
# Agent 打包时会把 TypeScript 预编译成 JS，产物不再依赖 tsx / esbuild，
# 三个平台的安装包完全一致（只有内置的 adb / go-ios 不同），
# 因此可以在一个 Linux runner 上全部产出，不需要 macOS / Windows 机器。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: 包内目录版本号，例如 0.1.5（留空则用 package.json 的版本）
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: agent-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: packages (linux runner)
    runs-on: ubuntu-latest
    env:
      # 手动触发时可指定版本号；tag 触发时脚本自己读 GITHUB_REF_NAME
      ADH_AGENT_VERSION: ${{ inputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 打包三个平台的 Agent
        run: pnpm package:agent

      - name: 打包三个平台的 server 离线包
        run: pnpm package:server --platform linux,win32,darwin

      - uses: actions/upload-artifact@v4
        with:
          name: adh-packages
          path: |
            dist/*.zip
            dist/adh-agent-manifest.json
          if-no-files-found: error
          retention-days: 30

  release:
    name: 上传到 Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: adh-packages
          path: dist

      - name: 正式 Release（tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/adh-agent-manifest.json

      - name: 滚动 Release（手动触发）
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: 最新构建
          body: |
            手动触发打包，包含三平台 Agent 与 Linux server 离线包。

            提交：${{ github.sha }}
          prerelease: true
          make_latest: false
          files: |
            dist/*.zip
            dist/adh-agent-manifest.json
