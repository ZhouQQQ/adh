name: adh-agent packages

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin
          - os: ubuntu-latest
            platform: linux

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 打包离线 Agent
        shell: bash
        run: pnpm package:agent --platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: adh-agent-${{ matrix.platform }}
          path: dist/adh-agent-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 30

  server:
    name: server-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 打包离线 server
        shell: bash
        run: pnpm package:server --platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: adh-server-${{ matrix.platform }}
          path: dist/adh-server-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: 上传到 Release
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [build, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 正式 Release（tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

      - name: 滚动 Release（main）
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: 最新构建
          body: |
            由 main 分支最新提交自动打包，包含 Agent 与 server 离线包。

            提交：${{ github.sha }}
          prerelease: true
          make_latest: false
          files: dist/*.zip