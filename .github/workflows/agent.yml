name: adh-agent packages

# 只在发版 tag 或手动触发时打包。
# Windows / macOS runner 按分钟计费（Windows $0.01、macOS $0.062），
# 不再随每次 push 自动跑。
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# 同一引用重复触发时取消旧任务，避免白跑
concurrency:
  group: agent-packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: agent-${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
          - os: macos-latest
            platform: darwin
          - os: ubuntu-latest
            platform: linux

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 打包离线 Agent
        shell: bash
        run: pnpm package:agent --platform ${{ matrix.platform }}

      - uses: actions/upload-artifact@v4
        with:
          name: adh-agent-${{ matrix.platform }}
          path: dist/adh-agent-${{ matrix.platform }}.zip
          if-no-files-found: error
          retention-days: 30

  # server 离线包只出 Linux：其他平台直接跑 Docker 镜像即可
  server:
    name: server-linux
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 打包离线 server
        shell: bash
        run: pnpm package:server --platform linux

      - uses: actions/upload-artifact@v4
        with:
          name: adh-server-linux
          path: dist/adh-server-linux.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: 上传到 Release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [agent, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: 正式 Release（tag）
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

      - name: 滚动 Release（手动触发）
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: agent-latest
          name: 最新构建
          body: |
            手动触发打包，包含 Agent 与 server 离线包。

            提交：${{ github.sha }}
          prerelease: true
          make_latest: false
          files: dist/*.zip
